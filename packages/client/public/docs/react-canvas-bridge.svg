<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Мост React и Canvas</title>
  <desc id="desc">Слои game canvas, React-оверлеи и взаимодействие через колбэки runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .box{fill:#334155;stroke:#94a3b8;stroke-width:1.5;rx:8;animation:glow 8s ease-in-out infinite}
      .lbl{fill:#f1f5f9;font:600 13px system-ui,sans-serif}
      .sub{fill:#cbd5e1;font:10px ui-monospace,monospace}
      .arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#m);animation:line 8s ease-in-out infinite}
      .feedback{stroke:#f59e0b;stroke-dasharray:6 4}
      @keyframes glow{0%,1.6%{stroke:#38bdf8;stroke-width:2.5;fill:#1e3a5f;filter:url(#glow)}3%,100%{stroke:#94a3b8;stroke-width:1.5;fill:#334155;filter:none}}
      @keyframes line{0%,1.6%{stroke:#38bdf8;stroke-width:2.5}3%,100%{stroke:#475569;stroke-width:2}}
      #b1,#l1{animation-delay:0s}#b2,#l2{animation-delay:1s}#b3,#l3{animation-delay:2s}#b4,#l4{animation-delay:3s}
      #b5,#l5{animation-delay:4s}#b6,#l6{animation-delay:5s}#b7,#l7{animation-delay:6s}#b8{animation-delay:7s}
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="460" y="34" text-anchor="middle" class="lbl" font-size="16">Мост React + Canvas API</text>
  <text x="460" y="52" text-anchor="middle" class="sub">Canvas — императивно; React-оверлеи — декларативно, поверх canvas</text>

  <rect id="b1" x="48" y="90" width="192" height="58" class="box"/>
  <g id="t1" transform="translate(144 0)">
    <text y="112" text-anchor="middle" class="lbl">GamePage.tsx</text>
    <text y="126" text-anchor="middle" class="sub">настройки + state роута</text>
    <text y="138" text-anchor="middle" class="sub">Компонент: GamePage</text>
  </g>
  <path id="l1" class="arr" d="M 240 119 L 302 119"/>
  <rect id="b2" x="302" y="90" width="212" height="58" class="box"/>
  <g id="t2" transform="translate(408 0)">
    <text y="112" text-anchor="middle" class="lbl">Match3Screen.tsx</text>
    <text y="126" text-anchor="middle" class="sub">mount canvas refs</text>
    <text y="138" text-anchor="middle" class="sub">Компонент: Match3Screen</text>
  </g>
  <path id="l2" class="arr" d="M 514 119 L 578 119"/>
  <rect id="b3" x="578" y="90" width="294" height="58" class="box"/>
  <g id="t3" transform="translate(725 0)">
    <text y="112" text-anchor="middle" class="lbl">createMatch3Game(boardCanvas, fxCanvas)</text>
    <text y="126" text-anchor="middle" class="sub">game canvas: доска + fx</text>
    <text y="138" text-anchor="middle" class="sub">Модуль: bootstrap.ts</text>
  </g>

  <path id="l3" class="arr" d="M 725 148 L 725 194"/>
  <rect id="b4" x="580" y="194" width="292" height="58" class="box"/>
  <g id="t4" transform="translate(726 0)">
    <text y="216" text-anchor="middle" class="lbl">Управление из React</text>
    <text y="230" text-anchor="middle" class="sub">setLevel / theme / vfx / startPlay</text>
    <text y="242" text-anchor="middle" class="sub">Модуль: runtime API</text>
  </g>
  <path id="l4" class="arr" d="M 580 223 L 516 223"/>
  <rect id="b5" x="292" y="194" width="224" height="58" class="box"/>
  <g id="t5" transform="translate(404 0)">
    <text y="216" text-anchor="middle" class="lbl">Циклы движка</text>
    <text y="230" text-anchor="middle" class="sub">отрисовка доски + fx + resolve</text>
    <text y="242" text-anchor="middle" class="sub">Модули: renderer + matchFx</text>
  </g>
  <path id="l5" class="arr" d="M 292 223 L 236 223"/>
  <rect id="b6" x="48" y="194" width="188" height="58" class="box"/>
  <g id="t6" transform="translate(142 0)">
    <text y="216" text-anchor="middle" class="lbl">onHudChange()</text>
    <text y="230" text-anchor="middle" class="sub">счёт / время / цели / комбо</text>
    <text y="242" text-anchor="middle" class="sub">Колбэк: onHudChange</text>
  </g>
  <path id="l6" class="arr feedback" d="M 142 252 L 142 306"/>
  <rect id="b7" x="48" y="306" width="256" height="64" class="box"/>
  <g id="t7" transform="translate(176 0)">
    <text y="332" text-anchor="middle" class="lbl">Слой React (DOM)</text>
    <text y="348" text-anchor="middle" class="sub">HUD, модалки, экран результата</text>
    <text y="360" text-anchor="middle" class="sub">Слой: React DOM</text>
  </g>
  <path id="l7" class="arr feedback" d="M 304 338 L 540 338 L 540 296 L 726 296 L 726 252"/>
  <rect id="b8" x="580" y="306" width="292" height="64" class="box"/>
  <g id="t8" transform="translate(726 0)">
    <text y="332" text-anchor="middle" class="lbl">Композиция на экране</text>
    <text y="348" text-anchor="middle" class="sub">canvas сзади, React сверху</text>
    <text y="360" text-anchor="middle" class="sub">Композиция: paint браузера</text>
  </g>

  <text x="48" y="460" class="sub">Два визуальных слоя: (1) game canvas = доска + fx, (2) React = HUD / модалки / события.</text>
  <text x="48" y="478" class="sub">Граница: React — UX и роут; движок — симуляция поля и кадры.</text>
</svg>

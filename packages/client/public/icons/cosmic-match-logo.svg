<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Cosmic Match">
  <defs>
    <radialGradient id="cm-a" cx="20%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="cm-b" cx="80%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="cm-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#cm-a)"/>
  <circle cx="16" cy="16" r="15" fill="url(#cm-b)"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="rgba(148,163,184,0.45)" stroke-width="1"/>
  <circle cx="10" cy="6" r="2" fill="#fbbf24" filter="url(#cm-glow)"/>
  <circle cx="22" cy="23" r="2" fill="#fbbf24" filter="url(#cm-glow)"/>
</svg>
